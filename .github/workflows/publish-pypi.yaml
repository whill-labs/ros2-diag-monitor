name: Release

# NOTE: This workflow does not gate on the Test workflow.
# Tags are expected to be pushed from main where tests have already passed.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ros2-diag-monitor
    permissions:
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
