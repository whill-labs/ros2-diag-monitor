[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ros2-diag-monitor"
version = "0.1.2"
description = "A terminal UI for monitoring ROS2 diagnostics over SSH"
readme = "README.md"
authors = [
    { name = "WHILL Inc." },
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.50",
]

[project.urls]
Repository = "https://github.com/whill-labs/ros2-diag-monitor"

[project.scripts]
diag-monitor = "diag_monitor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/diag_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p no:launch_testing",
    "-p no:launch_ros",
    "-p no:ament_copyright",
    "-p no:ament_xmllint",
    "-p no:ament_pep257",
    "-p no:ament_mypy",
    "-p no:ament_lint",
    "-p no:ament_flake8",
]
